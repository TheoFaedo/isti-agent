<main class="workspace">
  <app-sidebar
    [activeChatId]="currentChat().id"
    (newChat)="onNewChat()"
    (selectChat)="onSelectChat($event)"
    (deleteChat)="onDeleteChat($event)"
  />

  <section class="chat-panel" aria-label="Conversation avec ISTI Agent">
    <app-chat-header [currentChat]="currentChat()" />

    <div class="chat-content">
      @if (!hasResponse() && !isSending()) {
      <app-chat-welcome (suggestionSelected)="useSuggestion($event)" />
      } @else {
      <app-chat-messages [currentChat]="currentChat()" [isSending]="isSending()" />
      }
    </div>

    <app-message-composer [(prompt)]="prompt" [isSending]="isSending()" (submitted)="send()" />
  </section>
</main>
