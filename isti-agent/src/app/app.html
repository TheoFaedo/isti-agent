<main class="workspace">
  <app-sidebar />

  <section class="chat-panel" aria-label="Conversation avec ISTI Agent">
    <app-chat-header [currentChat]="agent.currentChat()" />

    <div class="chat-content">
      @if (!agent.hasResponse() && !agent.isSending()) {
      <app-chat-welcome />
      } @else {
      <app-chat-messages [currentChat]="agent.currentChat()" [isSending]="agent.isSending()" />
      }
    </div>

    <app-message-composer />
  </section>
</main>
