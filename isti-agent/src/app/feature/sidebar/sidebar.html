<aside class="sidebar" aria-label="Navigation principale">
  <a class="brand" href="/" aria-label="ISTI Agent, accueil"
    ><span class="brand-mark" aria-hidden="true">i</span><span>ISTI<span>agent</span></span></a
  >
  <div class="conversation-list">
    <p class="list-label">RÉCENT</p>
    <button
      class="conversation"
      [class.active]="activeChatId() === null"
      [attr.aria-pressed]="activeChatId() === null"
      type="button"
      (click)="onNewChat()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M20 11.5a8 8 0 0 1-8.8 7.96L7 22v-3.35A8 8 0 1 1 20 11.5Z" /></svg
      ><span>Nouvelle conversation</span>
    </button>
    @for (chat of chats(); track chat.id) {
    <div class="conversation-item">
      <button
        class="conversation"
        [class.active]="activeChatId() === chat.id"
        [attr.aria-pressed]="activeChatId() === chat.id"
        type="button"
        (click)="onChatSelect(chat.id)"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M20 11.5a8 8 0 0 1-8.8 7.96L7 22v-3.35A8 8 0 1 1 20 11.5Z" />
        </svg>
        <span>{{ chat.name }}</span>
      </button>
      <button
        class="delete-conversation"
        type="button"
        [attr.aria-label]="'Supprimer la conversation ' + chat.name"
        (click)="onChatDelete(chat.id)"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M3 6h18M9 6V4h6v2M8 6l1 14h6l1-14M10 10v6M14 10v6" />
        </svg>
      </button>
    </div>
    }
  </div>
  <div class="sidebar-footer">
    <button class="footer-link" type="button">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" /></svg
      >Paramètres
    </button>
    <div class="profile">
      <span class="avatar">TF</span
      ><span><strong>Théo Faedo</strong><small>Compte personnel</small></span
      ><span class="more" aria-hidden="true">•••</span>
    </div>
  </div>
</aside>
