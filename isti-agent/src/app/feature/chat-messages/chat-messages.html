<section class="messages" aria-live="polite">
  @for (message of history(); track $index) { @if (message.message.role === 'user') {
  <article class="message user-message">
    <div>
      <p class="message-name">Vous</p>
      <p [innerHTML]="message.message.content"></p>
    </div>
    <span class="avatar">TF</span>
  </article>
  } @else {
  <article class="message agent-message">
    <span class="agent-mini" aria-hidden="true">i</span>
    <div>
      <p class="message-name">ISTI Agent</p>
      <div class="response" [innerHTML]="message.html"></div>
    </div>
  </article>
  }} @if (isSending()) {
  <div class="typing" aria-label="ISTI Agent rédige une réponse">
    <span></span><span></span><span></span>
  </div>
  }
</section>
